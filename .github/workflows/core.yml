name: Core checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRD_ENABLE_OPENMP=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Maya-independent regression tests
        run: python tests/test_python_tools.py
      - name: Timeline failure and recovery
        run: python tests/test_timeline_errors.py
